<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 绘图助手 - DeepSeek</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }
        .panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .user-message {
            background: #667eea;
            color: white;
            margin-left: auto;
        }
        .ai-message {
            background: #e9ecef;
            color: #333;
        }
        .system-message {
            background: #fff3cd;
            color: #856404;
            text-align: center;
            max-width: 100%;
            font-size: 14px;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .preview-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 8px;
            overflow: hidden;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .status {
            padding: 10px;
            background: #e9ecef;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #495057;
        }
        .status.connected {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .examples {
            margin-bottom: 15px;
            padding: 10px;
            background: #e7f3ff;
            border-radius: 6px;
            font-size: 13px;
        }
        .examples h3 {
            font-size: 14px;
            margin-bottom: 8px;
            color: #0066cc;
        }
        .examples p {
            margin: 4px 0;
            color: #555;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .examples p:hover {
            background: rgba(102, 126, 234, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel">
            <h1>🤖 AI 绘图助手</h1>
            <div class="status" id="status">未连接</div>
            
            <div class="examples">
                <h3>💡 示例指令（点击快速输入）：</h3>
                <p onclick="setInput(this.textContent)">画一个红色的圆形，半径50，中心在(100,100)</p>
                <p onclick="setInput(this.textContent)">画一条从(0,0)到(200,200)的绿色直线</p>
                <p onclick="setInput(this.textContent)">画一个蓝色矩形，左上角(50,50)，宽100高80</p>
                <p onclick="setInput(this.textContent)">在(100,150)位置写"Hello CAD"，字高12</p>
                <p onclick="setInput(this.textContent)">画一个房子的平面图</p>
            </div>

            <div class="chat-container" id="chatContainer"></div>
            
            <div class="input-area">
                <input type="text" id="userInput" placeholder="告诉 AI 你想画什么..." />
                <button id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>

        <div class="panel">
            <h1>📊 实时预览</h1>
            <div class="preview-container" id="previewContainer">
                <p style="color: #999;">等待绘图...</p>
            </div>
        </div>
    </div>

    <script>
        const DEEPSEEK_API_KEY = 'sk-8796c0d7c0744097a6211d3f441e6492';
        const WS_URL = 'ws://localhost:8080/ws/render';
        
        let ws = null;
        let isProcessing = false;

        // 连接 WebSocket
        function connectWebSocket() {
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                updateStatus('已连接到渲染服务', 'connected');
                addSystemMessage('WebSocket 连接成功');
            };
            
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                handleWebSocketMessage(msg);
            };
            
            ws.onerror = () => {
                updateStatus('连接错误', 'error');
            };
            
            ws.onclose = () => {
                updateStatus('连接已断开', 'error');
                setTimeout(connectWebSocket, 3000);
            };
        }

        // 处理 WebSocket 消息
        function handleWebSocketMessage(msg) {
            switch(msg.type) {
                case 'connected':
                    addSystemMessage(`服务就绪，当前 ${msg.total_clients} 个客户端`);
                    break;
                    
                case 'preview':
                    const img = document.createElement('img');
                    img.src = `data:image/png;base64,${msg.data}`;
                    document.getElementById('previewContainer').innerHTML = '';
                    document.getElementById('previewContainer').appendChild(img);
                    addSystemMessage('✅ 预览已更新');
                    break;
                    
                case 'started':
                    addSystemMessage(`开始绘制 ${msg.shape_count} 个图形...`);
                    break;
                    
                case 'progress':
                    updateStatus(`处理中... ${msg.pct}% - ${msg.msg}`, 'connected');
                    break;
                    
                case 'result':
                    addSystemMessage(`✅ 绘制完成！成功 ${msg.success_count}/${msg.shape_count} 个图形`);
                    updateStatus('就绪', 'connected');
                    isProcessing = false;
                    break;
                    
                case 'error':
                    addSystemMessage(`❌ 错误: ${msg.msg}`);
                    updateStatus('错误', 'error');
                    isProcessing = false;
                    break;
            }
        }

        // 调用 DeepSeek AI
        async function callDeepSeekAI(userPrompt) {
            const systemPrompt = `你是一个 CAD 绘图助手。用户会用自然语言描述想要绘制的图形，你需要将其转换为 JSON 格式的绘图指令。

支持的图形类型：
1. AddCircle: {"id":"xxx", "type":"AddCircle", "center":[x,y,0], "radius":r, "color":"#RRGGBB", "layer":"0"}
2. AddLine: {"id":"xxx", "type":"AddLine", "start_point":[x1,y1,0], "end_point":[x2,y2,0], "color":"#RRGGBB", "layer":"0"}
3. AddRectangle: {"id":"xxx", "type":"AddRectangle", "x":x, "y":y, "width":w, "height":h, "color":"#RRGGBB", "layer":"0"}
4. AddText: {"id":"xxx", "type":"AddText", "text":"文字", "insert_point":[x,y,0], "height":12, "color":"#RRGGBB", "layer":"0"}
5. AddEllipse: {"id":"xxx", "type":"AddEllipse", "center":[x,y,0], "major_axis":[x2,y2,0], "radius_ratio":0.6, "color":"#RRGGBB", "layer":"0"}

请直接返回 JSON 数组格式，不要有任何其他文字说明。例如：
[{"id":"c1", "type":"AddCircle", "center":[100,100,0], "radius":50, "color":"#FF0000", "layer":"0"}]`;

            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userPrompt }
                        ],
                        temperature: 0.7,
                        max_tokens: 2000
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 错误: ${response.status}`);
                }

                const data = await response.json();
                const aiResponse = data.choices[0].message.content;
                
                return aiResponse;
            } catch (error) {
                throw new Error(`DeepSeek API 调用失败: ${error.message}`);
            }
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const userMessage = input.value.trim();
            
            if (!userMessage || isProcessing) return;
            
            input.value = '';
            isProcessing = true;
            
            addUserMessage(userMessage);
            updateStatus('AI 正在思考...', 'connected');
            
            try {
                const aiResponse = await callDeepSeekAI(userMessage);
                addAIMessage(aiResponse);
                
                let shapes;
                try {
                    const jsonMatch = aiResponse.match(/\[[\s\S]*\]/);
                    if (jsonMatch) {
                        shapes = JSON.parse(jsonMatch[0]);
                    } else {
                        shapes = JSON.parse(aiResponse);
                    }
                } catch (e) {
                    throw new Error('AI 返回的不是有效的 JSON 格式');
                }
                
                const drawRequest = {
                    type: 'ai_edit',
                    filename: `ai_drawing_${Date.now()}.dxf`,
                    file_data: null,
                    shapes: shapes
                };
                
                updateStatus('正在发送绘图指令...', 'connected');
                ws.send(JSON.stringify(drawRequest));
                
            } catch (error) {
                addSystemMessage(`❌ 错误: ${error.message}`);
                updateStatus('错误', 'error');
                isProcessing = false;
            }
        }

        // UI 辅助函数
        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'message user-message';
            div.textContent = text;
            document.getElementById('chatContainer').appendChild(div);
            scrollToBottom();
        }

        function addAIMessage(text) {
            const div = document.createElement('div');
            div.className = 'message ai-message';
            div.textContent = text;
            document.getElementById('chatContainer').appendChild(div);
            scrollToBottom();
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'message system-message';
            div.textContent = text;
            document.getElementById('chatContainer').appendChild(div);
            scrollToBottom();
        }

        function updateStatus(text, type = '') {
            const status = document.getElementById('status');
            status.textContent = text;
            status.className = 'status ' + type;
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        function setInput(text) {
            document.getElementById('userInput').value = text;
            document.getElementById('userInput').focus();
        }

        // 回车发送
        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isProcessing) {
                sendMessage();
            }
        });

        // 启动
        connectWebSocket();
    </script>
</body>
</html>
