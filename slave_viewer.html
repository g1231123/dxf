<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>被控端 - DXF 2D 展示</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(135deg, #0f3460, #16213e);
            border-bottom: 1px solid #667eea44;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .header h1 { font-size: 18px; font-weight: 700; }
        .header-right { display:flex; align-items:center; gap:16px; }
        .badge {
            display:flex; align-items:center; gap:8px;
            background: rgba(255,255,255,0.07);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
        }
        .dot { width:10px; height:10px; border-radius:50%; background:#f44336; animation:pulse 2s infinite; }
        .dot.on { background:#4caf50; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .file-badge {
            font-size: 12px;
            color: #aaa;
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* ── Body ── */
        .body { display:flex; flex:1; overflow:hidden; }

        /* ── Sidebar ── */
        .sidebar {
            width: 220px;
            background: #16213e;
            border-right: 1px solid #0f3460;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sb-section { padding: 14px 16px; border-bottom: 1px solid #0f3460; }
        .sb-section h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e94560;
            margin-bottom: 10px;
        }

        /* 统计 */
        .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
        .stat-item {
            background: #0f3460;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
        }
        .stat-item .val { font-size:20px; font-weight:700; color:#667eea; }
        .stat-item .lbl { font-size:10px; color:#aaa; margin-top:1px; }

        /* 图层 */
        .layer-list { max-height: 200px; overflow-y:auto; }
        .layer-item {
            display:flex; align-items:center; gap:8px;
            padding: 5px 4px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
        }
        .layer-item:hover { background: rgba(255,255,255,0.05); }
        .layer-item input { cursor:pointer; accent-color:#667eea; }
        .layer-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

        /* 控制 */
        .ctrl-row { margin-bottom: 10px; }
        .ctrl-row label { display:flex; justify-content:space-between; font-size:11px; color:#aaa; margin-bottom:4px; }
        input[type=range] { width:100%; accent-color:#667eea; }
        .btn {
            width:100%; padding:9px;
            background:#667eea; color:#fff;
            border:none; border-radius:8px;
            font-size:12px; font-weight:600;
            cursor:pointer; margin-top:6px;
            transition: background 0.2s;
        }
        .btn:hover { background:#5568d3; }
        .btn.ghost { background: rgba(255,255,255,0.06); }
        .btn.ghost:hover { background: rgba(255,255,255,0.12); }

        /* ── Canvas ── */
        .canvas-wrap { flex:1; position:relative; background:#0a0a14; overflow:hidden; }
        #c { position:absolute; top:0; left:0; cursor:grab; }
        #c.grabbing { cursor:grabbing; }

        /* 等待提示 */
        .placeholder {
            position:absolute; top:50%; left:50%;
            transform:translate(-50%,-50%);
            text-align:center; color:#444; pointer-events:none;
        }
        .placeholder .big { font-size:64px; }
        .placeholder p { font-size:14px; margin-top:10px; }
        .placeholder small { font-size:12px; color:#333; }

        /* Tooltip */
        #tooltip {
            display:none; position:fixed;
            background:rgba(22,33,62,0.96);
            border:1px solid #667eea;
            border-radius:8px; padding:8px 12px;
            font-size:12px; pointer-events:none; z-index:100;
        }
        #tooltip p { margin:2px 0; color:#ccc; }
        #tooltip strong { color:#fff; }

        /* 坐标提示 */
        .coord-bar {
            position: absolute;
            bottom: 12px;
            right: 16px;
            font-size: 12px;
            color: #555;
            background: rgba(10,10,20,0.7);
            padding: 4px 10px;
            border-radius: 6px;
        }

        /* ── 右侧实体列表面板 ── */
        .entity-panel {
            width: 300px;
            background: #16213e;
            border-left: 1px solid #0f3460;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .ep-header {
            padding: 12px 14px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .ep-header h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e94560;
        }
        .ep-count { font-size: 11px; color: #667eea; }
        .ep-filter {
            padding: 8px 10px;
            border-bottom: 1px solid #0f3460;
            flex-shrink: 0;
        }
        .ep-filter input {
            width: 100%;
            background: #0f3460;
            border: 1px solid #1a3a6e;
            border-radius: 6px;
            color: #eee;
            padding: 6px 10px;
            font-size: 12px;
        }
        .ep-filter input:focus { outline:none; border-color:#667eea; }
        .ep-tabs {
            display: flex;
            padding: 6px 10px;
            gap: 4px;
            border-bottom: 1px solid #0f3460;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .ep-tab {
            padding: 3px 8px;
            background: #0f3460;
            border: none;
            border-radius: 12px;
            color: #aaa;
            font-size: 11px;
            cursor: pointer;
        }
        .ep-tab.active { background: #667eea; color: #fff; }
        .ep-list {
            flex: 1;
            overflow-y: auto;
        }
        .ep-item {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(15,52,96,0.5);
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .ep-item:hover { background: rgba(102,126,234,0.1); }
        .ep-item.selected { background: rgba(102,126,234,0.2); border-left: 3px solid #667eea; }
        .ep-type-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
            background: #0f3460;
            color: #667eea;
            white-space: nowrap;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .ep-info { flex: 1; min-width: 0; }
        .ep-info .ep-layer { font-size: 10px; color: #777; margin-bottom: 2px; }
        .ep-info .ep-coord { font-size: 11px; color: #ccc; font-family: monospace; }
        .ep-info .ep-extra { font-size: 10px; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ep-export-row {
            padding: 10px;
            border-top: 1px solid #0f3460;
            flex-shrink: 0;
        }
        .ep-export-row button {
            width: 100%;
            padding: 8px;
            background: #0f3460;
            color: #aaa;
            border: 1px solid #1a3a6e;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .ep-export-row button:hover { background:#1a3a6e; color:#fff; }
    </style>
</head>
<body>

<div class="header">
    <h1>📺 被控端 — DXF 2D 实时查看</h1>
    <div class="header-right">
        <span class="file-badge" id="fileBadge">等待主控端上传文件...</span>
        <div class="badge">
            <div class="dot" id="dot"></div>
            <span id="statusTxt">未连接</span>
        </div>
    </div>
</div>

<div class="body">
    <!-- 侧栏 -->
    <div class="sidebar">

        <div class="sb-section">
            <h3>📊 实体统计</h3>
            <div class="stat-grid">
                <div class="stat-item"><div class="val" id="sCnt">—</div><div class="lbl">总计</div></div>
                <div class="stat-item"><div class="val" id="sLine">—</div><div class="lbl">线段</div></div>
                <div class="stat-item"><div class="val" id="sCircle">—</div><div class="lbl">圆/弧</div></div>
                <div class="stat-item"><div class="val" id="sPoly">—</div><div class="lbl">多段线</div></div>
                <div class="stat-item"><div class="val" id="sText">—</div><div class="lbl">文字</div></div>
                <div class="stat-item"><div class="val" id="sOther">—</div><div class="lbl">其他</div></div>
                <div class="stat-item"><div class="val" id="sDim">—</div><div class="lbl">标注</div></div>
            </div>
        </div>

        <div class="sb-section">
            <h3>🗂️ 图层</h3>
            <div class="layer-list" id="layerList">
                <p style="font-size:11px;color:#555">等待数据...</p>
            </div>
        </div>

        <div class="sb-section">
            <h3>🎮 视图</h3>
            <div class="ctrl-row">
                <label>缩放 <span id="zoomLbl">—</span></label>
                <input type="range" id="zoomSlider" min="0.05" max="20" step="0.05" value="1">
            </div>
            <button class="btn" onclick="fitView()">适应视图</button>
            <button class="btn ghost" onclick="resetView()">重置</button>
        </div>

    </div>

    <!-- Canvas -->
    <div class="canvas-wrap" id="canvasWrap"><!-- canvas-wrap start -->
        <canvas id="c"></canvas>

        <div class="placeholder" id="ph">
            <div class="big">📺</div>
            <p>等待主控端上传 DXF / DWG 文件</p>
            <small>上传后将自动展示</small>
        </div>

        <div class="coord-bar" id="coordBar">x: — , y: —</div>
    </div>

    <!-- 右侧实体列表面板 -->
    <div class="entity-panel">
        <div class="ep-header">
            <h3>📋 实体列表</h3>
            <span class="ep-count" id="epCount">0 个</span>
        </div>
        <div class="ep-filter">
            <input type="text" id="epSearch" placeholder="搜索图层、类型、文字..." oninput="filterEntities()">
        </div>
        <div class="ep-tabs" id="epTabs">
            <button class="ep-tab active" data-type="ALL" onclick="setTypeFilter(this)">全部</button>
            <button class="ep-tab" data-type="LINE" onclick="setTypeFilter(this)">线段</button>
            <button class="ep-tab" data-type="CIRCLE" onclick="setTypeFilter(this)">圆</button>
            <button class="ep-tab" data-type="ARC" onclick="setTypeFilter(this)">弧</button>
            <button class="ep-tab" data-type="POLY" onclick="setTypeFilter(this)">多段线</button>
            <button class="ep-tab" data-type="TEXT" onclick="setTypeFilter(this)">文字</button>
            <button class="ep-tab" data-type="DIM" onclick="setTypeFilter(this)">标注</button>
            <button class="ep-tab" data-type="OTHER" onclick="setTypeFilter(this)">其他</button>
        </div>
        <div class="ep-list" id="epList"></div>
        <div class="ep-export-row">
            <button onclick="exportCSV()">⬇ 导出坐标 CSV</button>
        </div>
    </div>
</div>

<div id="tooltip"></div>

<script>
const WS_URL = 'ws://localhost:8080/ws/render';

// ── 状态 ─────────────────────────────────────────────────────
let ws = null;
let entities = [];
let visibleLayers = new Set();
let zoom = 1, panX = 0, panY = 0;
let bounds = { minX:0, maxX:100, minY:0, maxY:100 };
let isDragging = false, dragSX, dragSY, panSX, panSY;
let hoveredEntity = null;

// ACI 颜色表
const ACI = {
    1:'#FF0000',2:'#FFFF00',3:'#00FF00',4:'#00FFFF',
    5:'#0000FF',6:'#FF00FF',7:'#FFFFFF',8:'#808080',
    9:'#C0C0C0',30:'#FF7F00',50:'#FFFF00',70:'#7FFF00',
    90:'#00FF00',130:'#00FFFF',150:'#007FFF',170:'#0000FF',
};
const aciColor = c => ACI[c] || '#FFFFFF';

const layerColors = {};
function layerColor(name) {
    if (!layerColors[name]) {
        let h = 0;
        for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
        layerColors[name] = `hsl(${h % 360},65%,58%)`;
    }
    return layerColors[name];
}

// ── Canvas ────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('canvasWrap');

function resizeCanvas() {
    canvas.width  = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
    render();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ── WebSocket ─────────────────────────────────────────────────
function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen  = () => setStatus('已连接', true);
    ws.onclose = () => { setStatus('连接断开', false); setTimeout(connect, 3000); };
    ws.onerror = () => setStatus('连接错误', false);
    ws.onmessage = ev => {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'connected') setStatus(`已连接 (${msg.total_clients} 端)`, true);
        if (msg.type === 'parsed')    onParsed(msg);
    };
}

function setStatus(txt, on) {
    document.getElementById('statusTxt').textContent = txt;
    document.getElementById('dot').className = 'dot' + (on ? ' on' : '');
}

// ── 接收解析结果 ──────────────────────────────────────────────
function onParsed(msg) {
    entities = msg.shapes || msg.entities || [];
    visibleLayers = new Set(msg.layers || []);

    document.getElementById('ph').style.display = 'none';
    document.getElementById('fileBadge').textContent = `${msg.filename}  (${msg.entity_count} 实体)`;

    // 统计
    let line=0, circle=0, poly=0, text=0, other=0, dim=0;
    for (const e of entities) {
        const t = e.type;
        if (t === 'AddLine') line++;
        else if (t === 'AddCircle' || t === 'AddArc') circle++;
        else if (['AddPolyline','AddSpline'].includes(t)) poly++;
        else if ((t === 'AddText' || t === 'AddMText') && e._source === 'DIMENSION') dim++;
        else if (t === 'AddText' || t === 'AddMText') text++;
        else other++;
    }
    document.getElementById('sCnt').textContent    = entities.length;
    document.getElementById('sLine').textContent   = line;
    document.getElementById('sCircle').textContent = circle;
    document.getElementById('sPoly').textContent   = poly;
    document.getElementById('sText').textContent   = text;
    document.getElementById('sOther').textContent  = other;
    document.getElementById('sDim').textContent    = dim;

    buildLayerList(msg.layers || []);
    calcBounds();
    fitView();
    selectedEntityIdx = -1;
    buildEntityList();
}

function buildLayerList(layers) {
    const el = document.getElementById('layerList');
    el.innerHTML = '';
    if (!layers.length) { el.innerHTML = '<p style="font-size:11px;color:#555">无图层</p>'; return; }
    for (const name of layers) {
        const color = layerColor(name);
        const item = document.createElement('div');
        item.className = 'layer-item';
        item.innerHTML = `
            <input type="checkbox" checked data-layer="${name}">
            <div class="layer-dot" style="background:${color}"></div>
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</span>
        `;
        item.querySelector('input').addEventListener('change', e => {
            if (e.target.checked) visibleLayers.add(name);
            else visibleLayers.delete(name);
            render();
        });
        el.appendChild(item);
    }
}

// ── 边界 ──────────────────────────────────────────────────────
function calcBounds() {
    let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
    function exp(x, y) {
        if(x<minX) minX=x; if(x>maxX) maxX=x;
        if(y<minY) minY=y; if(y>maxY) maxY=y;
    }
    for (const e of entities) {
        if (e.type === 'AddLine') { if(e.start_point) exp(e.start_point[0],e.start_point[1]); if(e.end_point) exp(e.end_point[0],e.end_point[1]); }
        else if (e.type === 'AddCircle' || e.type === 'AddArc') { if(e.center) { exp(e.center[0]-e.radius,e.center[1]-e.radius); exp(e.center[0]+e.radius,e.center[1]+e.radius); } }
        else if (e.points) for (const p of e.points) exp(p[0],p[1]);
        else if (e.insert_point) exp(e.insert_point[0],e.insert_point[1]);
        else if (e.center) exp(e.center[0],e.center[1]);
    }
    if (!isFinite(minX)) { minX=0; maxX=100; minY=0; maxY=100; }
    bounds = {minX, maxX, minY, maxY};
}

// ── 视图 ──────────────────────────────────────────────────────
function fitView() {
    const W=canvas.width, H=canvas.height;
    const bW=bounds.maxX-bounds.minX||1, bH=bounds.maxY-bounds.minY||1;
    zoom = Math.min(W/(bW*1.1), H/(bH*1.1));
    panX = W/2 - zoom*(bounds.minX+bW/2);
    panY = H/2 + zoom*(bounds.minY+bH/2);
    document.getElementById('zoomSlider').value = Math.min(20,zoom);
    document.getElementById('zoomLbl').textContent = zoom.toFixed(2)+'x';
    render();
}
function resetView() {
    zoom=1; panX=0; panY=0;
    document.getElementById('zoomSlider').value=1;
    document.getElementById('zoomLbl').textContent='1.0x';
    render();
}

// ── 坐标转换 ──────────────────────────────────────────────────
const tx = x => panX + x*zoom;
const ty = y => panY - y*zoom;

// ── 渲染 ──────────────────────────────────────────────────────
function render() {
    const W=canvas.width, H=canvas.height;
    ctx.fillStyle='#0a0a14';
    ctx.fillRect(0,0,W,H);
    drawGrid(W,H);
    if (!entities.length) return;
    for (const ent of entities) {
        if (!visibleLayers.has(ent.layer)) continue;
        drawEntity(ent);
    }
}

function drawGrid(W, H) {
    const step = zoom<0.5 ? 100 : zoom<2 ? 50 : 10;
    const gs = step * zoom;
    if (gs < 8) return;
    ctx.strokeStyle='#1a1a2e'; ctx.lineWidth=1;
    const sx=((panX%gs)+gs)%gs;
    for (let x=sx; x<W; x+=gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    const sy=((panY%gs)+gs)%gs;
    for (let y=sy; y<H; y+=gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    ctx.strokeStyle='#2a2a4e';
    if (panX>0&&panX<W) { ctx.beginPath(); ctx.moveTo(panX,0); ctx.lineTo(panX,H); ctx.stroke(); }
    if (panY>0&&panY<H) { ctx.beginPath(); ctx.moveTo(0,panY); ctx.lineTo(W,panY); ctx.stroke(); }
}

function drawEntity(ent) {
    const isH = ent===hoveredEntity;
    const baseColor = ent.color || '#FFFFFF';
    ctx.strokeStyle = isH ? '#ffee00' : baseColor;
    ctx.fillStyle   = isH ? '#ffee00' : baseColor;
    ctx.lineWidth   = (isH ? 2.5 : 1) / zoom;

    switch (ent.type) {
        case 'AddLine':
            if (!ent.start_point||!ent.end_point) break;
            ctx.beginPath();
            ctx.moveTo(tx(ent.start_point[0]), ty(ent.start_point[1]));
            ctx.lineTo(tx(ent.end_point[0]),   ty(ent.end_point[1]));
            ctx.stroke(); break;

        case 'AddCircle':
            ctx.beginPath();
            ctx.arc(tx(ent.center[0]), ty(ent.center[1]), ent.radius*zoom, 0, Math.PI*2);
            ctx.stroke(); break;

        case 'AddArc': {
            const sa=ent.start_angle*Math.PI/180, ea=ent.end_angle*Math.PI/180;
            ctx.beginPath();
            ctx.arc(tx(ent.center[0]), ty(ent.center[1]), ent.radius*zoom, -ea, -sa, false);
            ctx.stroke(); break;
        }

        case 'AddEllipse': {
            const [cx,cy]=[tx(ent.center[0]),ty(ent.center[1])];
            const maLen=Math.hypot(ent.major_axis[0],ent.major_axis[1])*zoom;
            const angle=Math.atan2(ent.major_axis[1],ent.major_axis[0]);
            ctx.save(); ctx.translate(cx,cy); ctx.rotate(-angle);
            ctx.beginPath(); ctx.ellipse(0,0,maLen,maLen*(ent.radius_ratio||0.5),0,0,Math.PI*2);
            ctx.stroke(); ctx.restore(); break;
        }

        case 'AddPolyline': case 'AddSpline':
            if (!ent.points||ent.points.length<2) break;
            ctx.beginPath();
            ctx.moveTo(tx(ent.points[0][0]), ty(ent.points[0][1]));
            for (let i=1;i<ent.points.length;i++) ctx.lineTo(tx(ent.points[i][0]),ty(ent.points[i][1]));
            if (ent.closed) ctx.closePath();
            ctx.stroke(); break;

        case 'AddText': case 'AddMText': {
            if (!ent.insert_point) break;
            const fs=Math.max(8, (ent.height||2.5)*zoom);
            ctx.save();
            ctx.translate(tx(ent.insert_point[0]), ty(ent.insert_point[1]));
            if (ent.rotation) ctx.rotate(-ent.rotation*Math.PI/180);
            ctx.font=`${fs}px sans-serif`;
            ctx.fillText(ent.text||'', 0, 0);
            ctx.restore(); break;
        }

        case 'AddInsert': {
            if (!ent.insert_point) break;
            ctx.save(); ctx.translate(tx(ent.insert_point[0]),ty(ent.insert_point[1]));
            ctx.strokeStyle='#888'; ctx.lineWidth=1;
            ctx.beginPath(); ctx.moveTo(-5,0); ctx.lineTo(5,0); ctx.moveTo(0,-5); ctx.lineTo(0,5); ctx.stroke();
            ctx.restore(); break;
        }
    }
}

// ── 鼠标交互 ──────────────────────────────────────────────────
canvas.addEventListener('mousedown', e => {
    isDragging=true; canvas.classList.add('grabbing');
    dragSX=e.clientX; dragSY=e.clientY; panSX=panX; panSY=panY;
});
canvas.addEventListener('mouseup',    () => { isDragging=false; canvas.classList.remove('grabbing'); });
canvas.addEventListener('mouseleave', () => { isDragging=false; canvas.classList.remove('grabbing'); });

canvas.addEventListener('mousemove', e => {
    if (isDragging) {
        panX=panSX+(e.clientX-dragSX); panY=panSY+(e.clientY-dragSY);
        render(); return;
    }
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    const dx=(mx-panX)/zoom, dy=(panY-my)/zoom;
    document.getElementById('coordBar').textContent = `x: ${dx.toFixed(2)} , y: ${dy.toFixed(2)}`;
    const hit=hitTest(dx,dy);
    if (hit!==hoveredEntity) { hoveredEntity=hit; render(); }
    showTooltip(hit, e.clientX, e.clientY);
});

canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    const f=e.deltaY<0?1.15:1/1.15;
    panX=mx-(mx-panX)*f; panY=my-(my-panY)*f;
    zoom=Math.max(0.005,Math.min(500,zoom*f));
    document.getElementById('zoomSlider').value=Math.min(20,zoom);
    document.getElementById('zoomLbl').textContent=zoom.toFixed(2)+'x';
    render();
},{passive:false});

document.getElementById('zoomSlider').addEventListener('input', e => {
    const nz=parseFloat(e.target.value);
    const cx=canvas.width/2, cy=canvas.height/2;
    panX=cx-(cx-panX)*nz/zoom; panY=cy-(cy-panY)*nz/zoom;
    zoom=nz;
    document.getElementById('zoomLbl').textContent=zoom.toFixed(2)+'x';
    render();
});

// ── Hit test ──────────────────────────────────────────────────
function hitTest(dx, dy) {
    const th=6/zoom;
    for (let i=entities.length-1;i>=0;i--) {
        const e=entities[i];
        if (!visibleLayers.has(e.layer)) continue;
        if ((e.type==='AddText'||e.type==='AddMText') && e.insert_point && Math.abs(e.insert_point[0]-dx)<th*5&&Math.abs(e.insert_point[1]-dy)<th*5) return e;
        if (e.type==='AddLine' && e.start_point&&e.end_point && distSeg(dx,dy,e.start_point[0],e.start_point[1],e.end_point[0],e.end_point[1])<th) return e;
        if (e.type==='AddCircle' && Math.abs(Math.hypot(dx-e.center[0],dy-e.center[1])-e.radius)<th) return e;
    }
    return null;
}
function distSeg(px,py,ax,ay,bx,by){
    const dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1)));
    return Math.hypot(px-ax-t*dx,py-ay-t*dy);
}

// ── Tooltip ───────────────────────────────────────────────────
const tooltip=document.getElementById('tooltip');
function showTooltip(ent, cx, cy) {
    if (!ent) { tooltip.style.display='none'; return; }
    let html=`<p><strong>类型:</strong> ${ent.type}</p>`;
    html+=`<p><strong>图层:</strong> ${ent.layer}</p>`;
    if (ent.name)   html+=`<p><strong>名称:</strong> ${ent.name}</p>`;
    if (ent.text)   html+=`<p><strong>内容:</strong> ${ent.text}</p>`;
    if (ent.radius) html+=`<p><strong>半径:</strong> ${ent.radius.toFixed(3)}</p>`;
    if (ent.handle) html+=`<p><strong>Handle:</strong> ${ent.handle}</p>`;
    tooltip.innerHTML=html;
    tooltip.style.display='block';
    tooltip.style.left=(cx+14)+'px';
    tooltip.style.top=(cy-10)+'px';
}

// ── 实体列表面板 ──────────────────────────────────────────────
let epTypeFilter = 'ALL';
let selectedEntityIdx = -1;

function getEntityCoord(ent) {
    if (ent.start_point)  return { x: ent.start_point[0], y: ent.start_point[1] };
    if (ent.center)       return { x: ent.center[0],      y: ent.center[1] };
    if (ent.insert_point) return { x: ent.insert_point[0],y: ent.insert_point[1] };
    if (ent.points && ent.points.length) return { x: ent.points[0][0], y: ent.points[0][1] };
    return { x: 0, y: 0 };
}

function getEntityExtra(ent) {
    const t = ent.type;
    if (t === 'AddLine' && ent.end_point)
        return `→ (${ent.end_point[0].toFixed(1)}, ${ent.end_point[1].toFixed(1)})`;
    if (t === 'AddCircle')
        return `R = ${ent.radius.toFixed(3)}`;
    if (t === 'AddArc')
        return `R=${ent.radius.toFixed(2)}  ${ent.start_angle.toFixed(1)}°→${ent.end_angle.toFixed(1)}°`;
    if (t === 'AddText' || t === 'AddMText')
        return ent.text ? `"${ent.text}"` : '';
    if (t === 'AddPolyline' || t === 'AddSpline')
        return `${ent.points ? ent.points.length : 0} 顶点${ent.closed ? ' · 闭合' : ''}`;
    if (t === 'AddEllipse')
        return `ratio = ${ent.radius_ratio !== undefined ? ent.radius_ratio.toFixed(3) : '—'}`;
    if (t === 'AddInsert')
        return `块: ${ent.block_name || '—'}`;
    return '';
}

function typeMatchesFilter(ent) {
    const type = ent.type;
    if (epTypeFilter === 'ALL')    return true;
    if (epTypeFilter === 'LINE')   return type === 'AddLine';
    if (epTypeFilter === 'CIRCLE') return type === 'AddCircle';
    if (epTypeFilter === 'ARC')    return type === 'AddArc';
    if (epTypeFilter === 'POLY')   return ['AddPolyline','AddSpline'].includes(type);
    if (epTypeFilter === 'TEXT')   return type === 'AddText' || type === 'AddMText';
    if (epTypeFilter === 'DIM')    return (type === 'AddText' || type === 'AddMText') && ent._source === 'DIMENSION';
    if (epTypeFilter === 'OTHER')  return ['AddEllipse','AddInsert','AddSpline'].includes(type);
    return false;
}

function buildEntityList() {
    const search = (document.getElementById('epSearch').value || '').toLowerCase();
    const list   = document.getElementById('epList');
    list.innerHTML = '';
    let count = 0;

    entities.forEach((ent, idx) => {
        if (!typeMatchesFilter(ent)) return;
        if (search) {
            const hay = [ent.type, ent.layer, ent.text || '', ent.handle || ''].join(' ').toLowerCase();
            if (!hay.includes(search)) return;
        }
        count++;
        const coord = getEntityCoord(ent);
        const extra = getEntityExtra(ent);

        const item = document.createElement('div');
        item.className = 'ep-item' + (idx === selectedEntityIdx ? ' selected' : '');
        item.dataset.idx = idx;
        item.innerHTML = `
            <div class="ep-type-badge">${ent.type.replace('Add','')}</div>
            <div class="ep-info">
                <div class="ep-layer">${ent.name || ent.handle || ''}  <span style="color:#555">${ent.layer}</span></div>
                <div class="ep-coord">x: ${coord.x.toFixed(3)}<br>y: ${coord.y.toFixed(3)}</div>
                ${extra ? `<div class="ep-extra">${extra}</div>` : ''}
            </div>
        `;
        item.addEventListener('click', () => selectEntity(idx, item));
        list.appendChild(item);
    });

    document.getElementById('epCount').textContent = count + ' 个';
}

function selectEntity(idx, itemEl) {
    selectedEntityIdx = idx;
    document.querySelectorAll('.ep-item').forEach(el => el.classList.remove('selected'));
    if (itemEl) itemEl.classList.add('selected');

    const ent = entities[idx];
    const coord = getEntityCoord(ent);

    // 飞到该实体
    const W = canvas.width, H = canvas.height;
    panX = W/2 - coord.x * zoom;
    panY = H/2 + coord.y * zoom;

    hoveredEntity = ent;
    render();

    // 高亮闪烁
    let flashes = 0;
    const orig = aciColor(ent.color);
    const timer = setInterval(() => {
        hoveredEntity = flashes++ % 2 === 0 ? ent : null;
        render();
        if (flashes >= 6) { clearInterval(timer); hoveredEntity = null; render(); }
    }, 200);
}

function setTypeFilter(btn) {
    document.querySelectorAll('.ep-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    epTypeFilter = btn.dataset.type;
    buildEntityList();
}

function filterEntities() {
    buildEntityList();
}

function exportCSV() {
    if (!entities.length) { alert('暂无实体数据'); return; }
    const rows = ['序号,类型,名称,图层,X,Y,附加信息,Handle'];
    entities.forEach((ent, i) => {
        const c = getEntityCoord(ent);
        const extra = getEntityExtra(ent).replace(/,/g, '，');
        rows.push(`${i+1},${ent.type},${ent.name||''},${ent.layer},${c.x.toFixed(4)},${c.y.toFixed(4)},"${extra}",${ent.handle||''}`);
    });
    const blob = new Blob(['\uFEFF'+rows.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'entities.csv';
    a.click();
}

// ── 启动 ──────────────────────────────────────────────────────
connect();
</script>
