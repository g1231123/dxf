<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>被控端 - DXF 2D 查看器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 24px;
            margin: 0;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f44336;
            animation: pulse 2s infinite;
        }
        .status-dot.connected {
            background: #4caf50;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-text {
            font-size: 14px;
        }
        .viewer-container {
            flex: 1;
            position: relative;
            background: #0a0a14;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #dxfCanvas {
            max-width: 100%;
            max-height: 100%;
            border: 1px solid #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(22, 33, 62, 0.95);
            border-radius: 12px;
            padding: 15px;
            min-width: 200px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(102, 126, 234, 0.3);
        }
        .controls h3 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #e94560;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .control-item {
            margin-bottom: 10px;
            font-size: 13px;
            color: #aaa;
        }
        .control-item label {
            display: block;
            margin-bottom: 5px;
            color: #fff;
        }
        .control-item input[type="range"] {
            width: 100%;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #5568d3;
        }
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(22, 33, 62, 0.95);
            border-radius: 12px;
            padding: 15px 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(102, 126, 234, 0.3);
            font-size: 13px;
        }
        .info-panel p {
            margin: 5px 0;
            color: #aaa;
        }
        .info-panel strong {
            color: #fff;
        }
        .placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
        }
        .placeholder h2 {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .placeholder p {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📺 被控端 - DXF 2D 查看器</h1>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-text" id="statusText">未连接</span>
            </div>
        </div>

        <div class="viewer-container">
            <canvas id="dxfCanvas" width="1200" height="800"></canvas>
            
            <div class="placeholder" id="placeholder">
                <h2>🎨</h2>
                <p>等待主控端发送 DXF 文件...</p>
                <p style="font-size: 14px; margin-top: 10px; color: #888;">WebSocket 连接中</p>
            </div>

            <div class="controls">
                <h3>🎮 控制</h3>
                <div class="control-item">
                    <label>缩放: <span id="zoomValue">1.0</span>x</label>
                    <input type="range" id="zoomSlider" min="0.1" max="5" step="0.1" value="1">
                </div>
                <div class="control-item">
                    <label>偏移 X: <span id="offsetXValue">0</span></label>
                    <input type="range" id="offsetXSlider" min="-500" max="500" step="10" value="0">
                </div>
                <div class="control-item">
                    <label>偏移 Y: <span id="offsetYValue">0</span></label>
                    <input type="range" id="offsetYSlider" min="-500" max="500" step="10" value="0">
                </div>
                <button class="btn" onclick="resetView()">重置视图</button>
                <button class="btn" onclick="toggleGrid()">切换网格</button>
            </div>

            <div class="info-panel" id="infoPanel" style="display: none;">
                <p><strong>文件名:</strong> <span id="fileName">-</span></p>
                <p><strong>图形数:</strong> <span id="shapeCount">-</span></p>
                <p><strong>引擎:</strong> <span id="engine">-</span></p>
                <p><strong>大小:</strong> <span id="fileSize">-</span></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.min.js"></script>
    
    <script>
        const WS_URL = 'ws://localhost:8080/ws/render';
        let ws = null;
        let dxfData = null;
        let zoom = 1.0;
        let offsetX = 0;
        let offsetY = 0;
        let showGrid = true;

        const canvas = document.getElementById('dxfCanvas');
        const ctx = canvas.getContext('2d');

        // WebSocket 连接
        function connectWebSocket() {
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                updateStatus('已连接', true);
                console.log('WebSocket 连接成功');
            };
            
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                handleMessage(msg);
            };
            
            ws.onerror = () => {
                updateStatus('连接错误', false);
            };
            
            ws.onclose = () => {
                updateStatus('连接断开', false);
                setTimeout(connectWebSocket, 3000);
            };
        }

        function handleMessage(msg) {
            console.log('收到消息:', msg);
            
            switch(msg.type) {
                case 'connected':
                    updateStatus(`已连接 (${msg.total_clients} 客户端)`, true);
                    break;
                    
                case 'result':
                    if (msg.format === 'dxf_base64' && msg.data) {
                        loadDXF(msg.data);
                        updateInfo(msg);
                    }
                    break;
                    
                case 'preview':
                    // 预览消息暂时忽略
                    break;
                    
                case 'error':
                    alert('错误: ' + msg.msg);
                    break;
            }
        }

        function updateStatus(text, connected) {
            document.getElementById('statusText').textContent = text;
            const dot = document.getElementById('statusDot');
            if (connected) {
                dot.classList.add('connected');
            } else {
                dot.classList.remove('connected');
            }
        }

        function updateInfo(msg) {
            document.getElementById('fileName').textContent = msg.filename || '-';
            document.getElementById('shapeCount').textContent = msg.shape_count || '-';
            document.getElementById('engine').textContent = msg.engine_used || '-';
            document.getElementById('fileSize').textContent = 
                msg.size_bytes ? (msg.size_bytes / 1024).toFixed(2) + ' KB' : '-';
            document.getElementById('infoPanel').style.display = 'block';
        }

        // 加载 DXF 文件
        function loadDXF(base64Data) {
            try {
                const dxfString = atob(base64Data);
                const parser = new window.DxfParser();
                dxfData = parser.parseSync(dxfString);
                
                console.log('DXF 解析结果:', dxfData);
                
                document.getElementById('placeholder').style.display = 'none';
                renderDXF();
                
            } catch (error) {
                console.error('DXF 加载失败:', error);
                alert('DXF 文件加载失败: ' + error.message);
            }
        }

        // 渲染 DXF
        function renderDXF() {
            if (!dxfData) return;
            
            // 清空画布
            ctx.fillStyle = '#0a0a14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格
            if (showGrid) {
                drawGrid();
            }
            
            ctx.save();
            
            // 应用变换
            ctx.translate(canvas.width / 2 + offsetX, canvas.height / 2 + offsetY);
            ctx.scale(zoom, -zoom); // Y轴翻转以匹配CAD坐标系
            
            // 绘制实体
            if (dxfData.entities) {
                dxfData.entities.forEach(entity => {
                    drawEntity(entity);
                });
            }
            
            ctx.restore();
        }

        function drawGrid() {
            ctx.strokeStyle = '#1a1a2e';
            ctx.lineWidth = 1;
            
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        function drawEntity(entity) {
            const color = entity.color ? getColorFromACI(entity.color) : '#ffffff';
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 1 / zoom;
            
            switch (entity.type) {
                case 'LINE':
                    drawLine(entity);
                    break;
                case 'CIRCLE':
                    drawCircle(entity);
                    break;
                case 'ARC':
                    drawArc(entity);
                    break;
                case 'POLYLINE':
                case 'LWPOLYLINE':
                    drawPolyline(entity);
                    break;
                case 'TEXT':
                case 'MTEXT':
                    drawText(entity);
                    break;
                default:
                    console.log('不支持的实体类型:', entity.type);
            }
        }

        function drawLine(entity) {
            ctx.beginPath();
            ctx.moveTo(entity.vertices[0].x, entity.vertices[0].y);
            ctx.lineTo(entity.vertices[1].x, entity.vertices[1].y);
            ctx.stroke();
        }

        function drawCircle(entity) {
            ctx.beginPath();
            ctx.arc(entity.center.x, entity.center.y, entity.radius, 0, 2 * Math.PI);
            ctx.stroke();
        }

        function drawArc(entity) {
            const startAngle = entity.startAngle * Math.PI / 180;
            const endAngle = entity.endAngle * Math.PI / 180;
            ctx.beginPath();
            ctx.arc(entity.center.x, entity.center.y, entity.radius, -endAngle, -startAngle, true);
            ctx.stroke();
        }

        function drawPolyline(entity) {
            if (!entity.vertices || entity.vertices.length === 0) return;
            
            ctx.beginPath();
            ctx.moveTo(entity.vertices[0].x, entity.vertices[0].y);
            
            for (let i = 1; i < entity.vertices.length; i++) {
                ctx.lineTo(entity.vertices[i].x, entity.vertices[i].y);
            }
            
            ctx.stroke();
        }

        function drawText(entity) {
            ctx.save();
            ctx.scale(1, -1); // 文字需要再次翻转
            ctx.font = `${(entity.textHeight || 12) * zoom}px Arial`;
            ctx.fillText(entity.text || '', entity.startPoint.x, -entity.startPoint.y);
            ctx.restore();
        }

        function getColorFromACI(aci) {
            const colors = {
                1: '#ff0000', 2: '#ffff00', 3: '#00ff00', 4: '#00ffff',
                5: '#0000ff', 6: '#ff00ff', 7: '#ffffff', 8: '#808080'
            };
            return colors[aci] || '#ffffff';
        }

        // 控制函数
        window.resetView = function() {
            zoom = 1.0;
            offsetX = 0;
            offsetY = 0;
            document.getElementById('zoomSlider').value = 1.0;
            document.getElementById('offsetXSlider').value = 0;
            document.getElementById('offsetYSlider').value = 0;
            document.getElementById('zoomValue').textContent = '1.0';
            document.getElementById('offsetXValue').textContent = '0';
            document.getElementById('offsetYValue').textContent = '0';
            renderDXF();
        };

        window.toggleGrid = function() {
            showGrid = !showGrid;
            renderDXF();
        };

        // 滑块事件
        document.getElementById('zoomSlider').addEventListener('input', (e) => {
            zoom = parseFloat(e.target.value);
            document.getElementById('zoomValue').textContent = zoom.toFixed(1);
            renderDXF();
        });

        document.getElementById('offsetXSlider').addEventListener('input', (e) => {
            offsetX = parseInt(e.target.value);
            document.getElementById('offsetXValue').textContent = offsetX;
            renderDXF();
        });

        document.getElementById('offsetYSlider').addEventListener('input', (e) => {
            offsetY = parseInt(e.target.value);
            document.getElementById('offsetYValue').textContent = offsetY;
            renderDXF();
        });

        // 鼠标拖动
        let isDragging = false;
        let lastX, lastY;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - lastX;
                const dy = e.clientY - lastY;
                offsetX += dx;
                offsetY += dy;
                lastX = e.clientX;
                lastY = e.clientY;
                document.getElementById('offsetXSlider').value = offsetX;
                document.getElementById('offsetYSlider').value = offsetY;
                document.getElementById('offsetXValue').textContent = offsetX;
                document.getElementById('offsetYValue').textContent = offsetY;
                renderDXF();
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
        });

        // 鼠标滚轮缩放
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            zoom *= delta;
            zoom = Math.max(0.1, Math.min(5, zoom));
            document.getElementById('zoomSlider').value = zoom;
            document.getElementById('zoomValue').textContent = zoom.toFixed(1);
            renderDXF();
        });

        // 启动
        connectWebSocket();
    </script>
</body>
</html>
