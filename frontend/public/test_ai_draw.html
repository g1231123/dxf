<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 画圆测试 - WebSocket</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        .content {
            padding: 30px;
        }
        .section {
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: #667eea;
            border-radius: 2px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        .row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .btn-success {
            background: #4CAF50;
            color: white;
        }
        .btn-success:hover {
            background: #45a049;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 15px;
        }
        .status.connecting {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .log-container {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-entry {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: #d4d4d4;
            margin-bottom: 4px;
            padding: 2px 0;
            border-bottom: 1px solid #333;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .log-entry.sent {
            color: #4ec9b0;
        }
        .log-entry.received {
            color: #ce9178;
        }
        .log-entry.error {
            color: #f48771;
        }
        .log-time {
            color: #858585;
            margin-right: 8px;
        }
        .result-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        .result-info h4 {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
        }
        .result-info pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            overflow-x: auto;
            max-height: 200px;
            overflow-y: auto;
        }
        .hidden {
            display: none;
        }
        .engine-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .engine-badge.autocad {
            background: #e3f2fd;
            color: #1976d2;
        }
        .engine-badge.ezdxf {
            background: #e8f5e9;
            color: #388e3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 AI 画圆测试工具</h1>
            <p>WebSocket 实时绘图接口测试 | 支持 AutoCAD COM / ezdxf 双引擎</p>
        </div>

        <div class="content">
            <!-- 连接设置 -->
            <div class="section">
                <div class="section-title">连接设置</div>
                <div class="form-group">
                    <label>WebSocket 地址</label>
                    <input type="text" id="wsUrl" value="ws://103.39.221.54:10792/ws/render" placeholder="ws://localhost:8080/ws/render">
                </div>
                <div class="btn-group">
                    <button class="btn-primary" onclick="connect()">🔗 连接</button>
                    <button class="btn-secondary" onclick="disconnect()">❌ 断开</button>
                </div>
                <div id="connectionStatus" class="status info">未连接</div>
            </div>

            <!-- 引擎选择 -->
            <div class="section">
                <div class="section-title">绘图引擎</div>
                <div class="form-group">
                    <label>选择引擎（自动检测可用性）</label>
                    <select id="engine">
                        <option value="">🔄 自动选择（优先 AutoCAD COM）</option>
                        <option value="autocad">🖥️ AutoCAD COM（Windows 需运行 AutoCAD）</option>
                        <option value="ezdxf">📦 ezdxf（跨平台，无需 AutoCAD）</option>
                    </select>
                </div>
            </div>

            <!-- 图形参数 -->
            <div class="section">
                <div class="section-title">圆的参数（可选，不传则使用默认值）</div>
                <div class="row">
                    <div class="form-group">
                        <label>圆心 X (cx)</label>
                        <input type="number" id="cx" value="100" step="1">
                    </div>
                    <div class="form-group">
                        <label>圆心 Y (cy)</label>
                        <input type="number" id="cy" value="100" step="1">
                    </div>
                    <div class="form-group">
                        <label>半径 (r)</label>
                        <input type="number" id="r" value="50" step="1" min="0.1">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>颜色</label>
                        <input type="text" id="color" value="#FF0000" placeholder="#FF0000">
                    </div>
                    <div class="form-group">
                        <label>图层</label>
                        <input type="text" id="layer" value="AI_CIRCLES" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>输出格式</label>
                        <select id="outputFormat">
                            <option value="dxf">DXF</option>
                            <option value="dwg">DWG</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="section">
                <div class="section-title">发送请求</div>
                <div class="btn-group">
                    <button class="btn-primary" onclick="sendDrawCircle()">⭕ 画圆</button>
                    <button class="btn-secondary" onclick="sendMinimal()">⚡ 极简请求（只传 type）</button>
                    <button class="btn-success" onclick="clearLog()">🗑️ 清空日志</button>
                </div>
            </div>

            <!-- 日志 -->
            <div class="section">
                <div class="section-title">通信日志</div>
                <div class="log-container" id="logContainer">
                    <div class="log-entry">等待连接...</div>
                </div>
            </div>

            <!-- 结果 -->
            <div class="section hidden" id="resultSection">
                <div class="section-title">绘制结果</div>
                <div class="result-info">
                    <h4>文件信息</h4>
                    <div id="resultInfo"></div>
                    <h4 style="margin-top: 15px;">响应详情</h4>
                    <pre id="resultJson"></pre>
                    <button class="btn-success" onclick="downloadFile()" style="margin-top: 15px;">
                        ⬇️ 下载结果文件
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let lastResult = null;

        function getTime() {
            return new Date().toLocaleTimeString('zh-CN', { hour12: false });
        }

        function log(message, type = 'info') {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="log-time">[${getTime()}]</span>${message}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        function updateStatus(text, state) {
            const status = document.getElementById('connectionStatus');
            status.textContent = text;
            status.className = `status ${state}`;
        }

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                log('已经连接', 'error');
                return;
            }

            const url = document.getElementById('wsUrl').value;
            updateStatus('连接中...', 'connecting');
            log(`正在连接: ${url}`, 'info');

            ws = new WebSocket(url);

            ws.onopen = () => {
                updateStatus('已连接', 'connected');
                log('✅ WebSocket 连接成功', 'received');
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    log(`⬅️ 收到: ${msg.type}`, 'received');
                    handleMessage(msg);
                } catch (e) {
                    log(`⬅️ 收到原始数据: ${event.data.substring(0, 200)}...`, 'received');
                }
            };

            ws.onerror = (error) => {
                updateStatus('连接错误', 'error');
                log('❌ WebSocket 错误', 'error');
            };

            ws.onclose = () => {
                updateStatus('已断开', 'error');
                log('🔌 WebSocket 已关闭', 'error');
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function handleMessage(msg) {
            if (msg.type === 'connected') {
                log(`服务端就绪 (客户端ID: ${msg.client_id})`, 'info');
            } else if (msg.type === 'started') {
                log(`🚀 开始绘制: ${msg.filename} (引擎: ${msg.engine_requested || 'auto'})`, 'info');
            } else if (msg.type === 'result') {
                lastResult = msg;
                const engineBadge = msg.engine_used === 'autocad' 
                    ? '<span class="engine-badge autocad">AutoCAD COM</span>'
                    : '<span class="engine-badge ezdxf">ezdxf</span>';
                
                document.getElementById('resultSection').classList.remove('hidden');
                document.getElementById('resultInfo').innerHTML = `
                    <p><strong>文件名:</strong> ${msg.filename}</p>
                    <p><strong>引擎:</strong> ${engineBadge}</p>
                    <p><strong>文件大小:</strong> ${msg.size_bytes} 字节</p>
                    <p><strong>图形数:</strong> ${msg.shape_count} (成功: ${msg.success_count}, 失败: ${msg.error_count})</p>
                `;
                document.getElementById('resultJson').textContent = JSON.stringify(msg, null, 2);
                log(`✅ 绘制完成! 引擎: ${msg.engine_used}, 文件: ${msg.filename}`, 'received');
            } else if (msg.type === 'error') {
                log(`❌ 错误: ${msg.code} - ${msg.msg}`, 'error');
            } else if (msg.type === 'progress') {
                log(`📊 进度: ${msg.pct}% - ${msg.msg}`, 'info');
            }
        }

        function sendDrawCircle() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('请先连接 WebSocket');
                return;
            }

            const cx = parseFloat(document.getElementById('cx').value) || 100;
            const cy = parseFloat(document.getElementById('cy').value) || 100;
            const r = parseFloat(document.getElementById('r').value) || 50;
            const color = document.getElementById('color').value || '#FF0000';
            const layer = document.getElementById('layer').value || 'AI_CIRCLES';
            const outputFormat = document.getElementById('outputFormat').value;
            const engine = document.getElementById('engine').value;

            const request = {
                type: 'ai_edit',
                output_format: outputFormat,
                shapes: [{
                    id: 'circle_' + Date.now(),
                    type: 'circle',
                    layer: layer,
                    geometry: {
                        cx: cx,
                        cy: cy,
                        r: r
                    },
                    style: {
                        stroke_color: color,
                        stroke_width: 0.25
                    }
                }]
            };

            if (engine) {
                request.engine = engine;
            }

            ws.send(JSON.stringify(request));
            log(`➡️ 发送: 画圆 (${cx}, ${cy}, r=${r})`, 'sent');
        }

        function sendMinimal() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('请先连接 WebSocket');
                return;
            }

            const request = {
                type: 'ai_edit'
            };

            const engine = document.getElementById('engine').value;
            if (engine) {
                request.engine = engine;
            }

            ws.send(JSON.stringify(request));
            log('➡️ 发送: 极简请求（只传 type，使用默认圆）', 'sent');
        }

        function clearLog() {
            document.getElementById('logContainer').innerHTML = '';
            log('日志已清空', 'info');
        }

        function downloadFile() {
            if (!lastResult || !lastResult.data) {
                alert('没有可下载的文件');
                return;
            }

            const byteCharacters = atob(lastResult.data);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);

            const format = lastResult.format === 'dwg_base64' ? 'application/octet-stream' : 'application/dxf';
            const blob = new Blob([byteArray], { type: format });
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = lastResult.filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            log(`⬇️ 已下载: ${lastResult.filename}`, 'info');
        }

        // 页面加载时自动连接
        window.onload = () => {
            log('页面加载完成，点击"连接"按钮开始测试', 'info');
        };
    </script>
</body>
</html>
